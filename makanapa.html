<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakanApa? Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background-color: #fef3c7; }

        /* UI COMPONENTS */
        .chat-container { height: 60vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #f97316 #fef3c7; }
        .message-bubble { max-width: 80%; border-radius: 20px; margin-bottom: 12px; padding: 12px 16px; animation: fadeIn 0.3s ease; }
        .user-msg { background-color: #f97316; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-msg { background-color: white; color: #431407; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        
        /* AUCTION CARDS */
        .auction-card { background: white; border: 1px solid #ffedd5; transition: all 0.3s ease; }
        .auction-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* MODAL */
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 15% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; animation: fadeIn 0.3s; }
    </style>
</head>
<body class="flex flex-col items-center p-4 min-h-screen">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-orange-500 relative">
        
        <!-- HEADER -->
        <header class="bg-orange-500 p-4 text-white flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2"><span>😋</span> MakanApa?</h1>
            <button id="toggle-role-btn" class="bg-white text-orange-600 px-3 py-1 rounded-full text-xs font-bold hover:bg-orange-50 shadow-sm">
                Switch to Seller
            </button>
        </header>

        <!-- === BUYER VIEW === -->
        <div id="buyer-view" class="block">
            <main id="chat-area" class="chat-container p-6 flex flex-col gap-2 bg-orange-50/30"></main>
            
            <!-- Buyer Input -->
            <footer class="p-4 border-t bg-white flex gap-2">
                <input type="text" id="user-input" placeholder="Describe what you want to eat..." 
                       class="flex-1 p-3 rounded-xl border-2 border-orange-200 focus:outline-none focus:border-orange-500">
                <button id="send-btn" class="bg-orange-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-orange-700 transition">
                    Ask
                </button>
            </footer>
        </div>

        <!-- === SELLER VIEW === -->
        <div id="seller-view" class="hidden bg-gray-50 h-[60vh] flex flex-col">
            <div class="p-4 bg-orange-100 border-b border-orange-200">
                <h2 class="font-bold text-orange-800">📋 Active Requests</h2>
                <p class="text-xs text-orange-600">Give your best offer to win the customer!</p>
            </div>
            <div id="seller-requests" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                <!-- Request Cards will go here -->
                <div class="text-center text-gray-400 mt-10 italic">No active requests yet...</div>
            </div>
        </div>

    </div>

    <!-- CONTACT MENU MODAL -->
    <div id="contact-modal" class="modal">
        <div class="modal-content relative text-center">
            <span class="absolute top-2 right-4 text-2xl cursor-pointer text-gray-400 hover:text-gray-600" onclick="closeModal()">&times;</span>
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-brands fa-whatsapp text-3xl text-green-600"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">Contact Seller</h2>
            <p id="modal-seller-name" class="text-sm text-gray-500 mb-4">Warung Bu Ijah</p>
            
            <div class="bg-gray-50 p-4 rounded-xl mb-4 text-left border border-gray-100">
                <div class="text-xs text-gray-400 uppercase font-bold">Your Order</div>
                <div id="modal-food-name" class="font-bold text-gray-800 text-lg">Nasi Goreng Spesial</div>
                <div id="modal-price" class="text-orange-600 font-bold">Rp 25,000</div>
            </div>

            <a id="whatsapp-link" href="#" target="_blank" class="block w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition mb-2 shadow-lg shadow-green-200">
                Chat on WhatsApp
            </a>
            <button onclick="closeModal()" class="block w-full bg-gray-100 text-gray-600 py-3 rounded-xl font-bold hover:bg-gray-200 transition">
                Close
            </button>
        </div>
    </div>

    <script>
        /**
         * CONFIGURATION
         * Set USE_PHP_BACKEND to true if you are hosting the PHP files.
         * Set to false to use the Local Simulation for testing in Canvas.
         */
        const USE_PHP_BACKEND = false; 
        const API_URL = 'api.php'; 

        // State
        let currentRole = 'buyer'; // 'buyer' or 'seller'
        let currentRequestId = null;
        let pollingInterval = null;

        // UI Elements
        const buyerView = document.getElementById('buyer-view');
        const sellerView = document.getElementById('seller-view');
        const chatArea = document.getElementById('chat-area');
        const sellerRequestsList = document.getElementById('seller-requests');
        const roleBtn = document.getElementById('toggle-role-btn');
        const userInput = document.getElementById('user-input');
        
        // --- CORE LOGIC ---

        // 1. Send Request (Buyer)
        async function sendRequest(text) {
            addMessage(text, 'user');
            addMessage("Waiting for sellers to offer their best price... ⏳", 'bot');
            
            if (USE_PHP_BACKEND) {
                try {
                    const formData = new FormData();
                    formData.append('action', 'create_request');
                    formData.append('description', text);
                    const res = await fetch(API_URL, { method: 'POST', body: formData });
                    const data = await res.json();
                    currentRequestId = data.request_id;
                    startPollingOffers();
                } catch(e) { console.error(e); }
            } else {
                // Mock Backend: Store request in "Cloud" (LocalStorage)
                currentRequestId = Date.now();
                const requests = JSON.parse(localStorage.getItem('mock_requests') || '[]');
                requests.push({ id: currentRequestId, text: text, timestamp: Date.now() });
                localStorage.setItem('mock_requests', JSON.stringify(requests));
                startPollingOffers(); // Start checking for offers
            }
        }

        // 2. Poll for Offers (Buyer)
        function startPollingOffers() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                let offers = [];
                
                if (USE_PHP_BACKEND) {
                    try {
                        const res = await fetch(`${API_URL}?action=get_offers&request_id=${currentRequestId}`);
                        offers = await res.json();
                    } catch(e) {}
                } else {
                    // Mock Backend: Check LocalStorage for offers linked to this request
                    const allOffers = JSON.parse(localStorage.getItem('mock_offers') || '[]');
                    offers = allOffers.filter(o => o.requestId == currentRequestId);
                }

                if (offers.length > 0) {
                    renderAuction(offers);
                    clearInterval(pollingInterval); // Stop polling once we get offers (or keep polling if you want dynamic updates)
                }
            }, 2000); // Check every 2 seconds
        }

        // 3. Render Auction Cards (Buyer)
        function renderAuction(offers) {
            // Sort by price (Cheapest gets 3 pts)
            offers.sort((a, b) => a.price - b.price);

            const auctionId = Date.now().toString().slice(-4);
            const msgDiv = document.createElement('div');
            msgDiv.className = 'bot-msg message-bubble w-full';
            msgDiv.innerHTML = `
                <div class="font-bold text-orange-600 mb-2 flex justify-between">
                    <span>🔥 LIVE OFFERS</span>
                    <span class="text-xs text-gray-400">#${auctionId}</span>
                </div>
                <div class="flex flex-col gap-2" id="auction-list-${auctionId}"></div>
            `;
            chatArea.appendChild(msgDiv);
            
            const list = msgDiv.querySelector(`#auction-list-${auctionId}`);
            
            offers.forEach((offer, index) => {
                const points = index === 0 ? 3 : (index === 1 ? 2 : 1);
                const badgeColor = index === 0 ? 'text-green-600 bg-green-50' : 'text-orange-600 bg-orange-50';
                
                const card = document.createElement('div');
                card.className = 'auction-card p-3 rounded-xl flex justify-between items-center';
                card.innerHTML = `
                    <div>
                        <div class="text-[10px] text-gray-500 font-bold uppercase">${offer.seller_name}</div>
                        <div class="font-bold text-gray-800">${offer.food_name}</div>
                        <div class="text-[10px] ${badgeColor} inline-block px-1 rounded font-bold mt-1">
                             ⭐ Score: ${points} pts
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold text-orange-600">Rp ${parseInt(offer.price).toLocaleString()}</div>
                        <button onclick="openContact('${offer.seller_name}', '${offer.food_name}', '${offer.price}', '${offer.contact}')" 
                                class="bg-orange-500 text-white text-xs px-3 py-1.5 rounded-lg mt-1 font-bold hover:bg-orange-600">
                            Contact
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 4. Load Requests (Seller)
        async function loadSellerRequests() {
            let requests = [];
            if (USE_PHP_BACKEND) {
                try {
                    const res = await fetch(`${API_URL}?action=get_requests`);
                    requests = await res.json();
                } catch(e) {}
            } else {
                requests = JSON.parse(localStorage.getItem('mock_requests') || '[]');
                // Filter out requests that already have offers (optional logic)
            }

            sellerRequestsList.innerHTML = '';
            if (requests.length === 0) {
                sellerRequestsList.innerHTML = '<div class="text-center text-gray-400 mt-10">No active requests</div>';
                return;
            }

            requests.reverse().forEach(req => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="bg-blue-100 text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded">NEW REQUEST</span>
                            <p class="font-bold text-gray-800 text-lg mt-1">"${req.text}"</p>
                        </div>
                        <div class="text-xs text-gray-400">${new Date(req.timestamp).toLocaleTimeString()}</div>
                    </div>
                    
                    <!-- Offer Form -->
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-sm">
                        <input type="text" id="offer-name-${req.id}" placeholder="Dish Name (e.g. Nasi Goreng Gila)" class="w-full mb-2 p-2 rounded border focus:border-orange-500 outline-none">
                        <div class="flex gap-2 mb-2">
                            <input type="number" id="offer-price-${req.id}" placeholder="Price (Rp)" class="w-1/2 p-2 rounded border focus:border-orange-500 outline-none">
                            <input type="text" id="offer-contact-${req.id}" placeholder="WhatsApp (e.g. 62812...)" class="w-1/2 p-2 rounded border focus:border-orange-500 outline-none">
                        </div>
                        <button onclick="submitOffer(${req.id})" class="w-full bg-orange-500 text-white font-bold py-2 rounded hover:bg-orange-600 transition">
                            Submit Offer
                        </button>
                    </div>
                `;
                sellerRequestsList.appendChild(card);
            });
        }

        // 5. Submit Offer (Seller)
        async function submitOffer(reqId) {
            const foodName = document.getElementById(`offer-name-${reqId}`).value;
            const price = document.getElementById(`offer-price-${reqId}`).value;
            const contact = document.getElementById(`offer-contact-${reqId}`).value;
            
            if (!foodName || !price || !contact) return alert("Please fill all fields");

            const offerData = {
                request_id: reqId,
                seller_name: "Warung " + (Math.floor(Math.random() * 100) + 1), // Simulating seller name
                food_name: foodName,
                price: price,
                contact: contact
            };

            if (USE_PHP_BACKEND) {
                const formData = new FormData();
                formData.append('action', 'add_offer');
                for (const key in offerData) formData.append(key, offerData[key]);
                await fetch(API_URL, { method: 'POST', body: formData });
            } else {
                const offers = JSON.parse(localStorage.getItem('mock_offers') || '[]');
                offers.push({ ...offerData, requestId: reqId });
                localStorage.setItem('mock_offers', JSON.stringify(offers));
            }

            alert("Offer sent to customer!");
            loadSellerRequests(); // Refresh UI
        }

        // --- UTILS ---

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `${type === 'user' ? 'user-msg' : 'bot-msg'} message-bubble`;
            div.innerText = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Modal Logic
        const modal = document.getElementById('contact-modal');
        window.openContact = (seller, food, price, contact) => {
            document.getElementById('modal-seller-name').innerText = seller;
            document.getElementById('modal-food-name').innerText = food;
            document.getElementById('modal-price').innerText = "Rp " + parseInt(price).toLocaleString();
            
            // Create WhatsApp Link
            const msg = `Hi ${seller}, I want to order ${food} for Rp ${price}. Is it available?`;
            const waLink = `https://wa.me/${contact}?text=${encodeURIComponent(msg)}`;
            document.getElementById('whatsapp-link').href = waLink;

            modal.style.display = 'block';
        }
        window.closeModal = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) closeModal(); }

        // Role Switching
        roleBtn.onclick = () => {
            if (currentRole === 'buyer') {
                currentRole = 'seller';
                buyerView.classList.add('hidden');
                sellerView.classList.remove('hidden');
                roleBtn.innerText = "Switch to Buyer";
                loadSellerRequests();
            } else {
                currentRole = 'buyer';
                sellerView.classList.add('hidden');
                buyerView.classList.remove('hidden');
                roleBtn.innerText = "Switch to Seller";
            }
        };

        // Init
        document.getElementById('send-btn').onclick = () => {
            const val = userInput.value;
            if(val.trim()) { userInput.value = ''; sendRequest(val); }
        }
        userInput.onkeypress = (e) => { if(e.key === 'Enter') document.getElementById('send-btn').click(); }

        addMessage("Welcome! Type what you want to eat, and sellers will bid for your order.", "bot");

    </script>
</body>
</html>
